name: Sync FSM Timetable Data

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Execute Scraper Pipeline
        run: |
          python scraper.py

      - name: Commit and Push if timetable.json Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if timetable.json was modified
          if [ -n "$(git status --porcelain timetable.json)" ]; then
            echo "Changes detected in timetable.json. Committing and pushing..."
            git add timetable.json
            git commit -m "chore(sync): update timetable.json [skip ci]"
            git push
          else
            echo "No changes detected in timetable.json."
          fi
